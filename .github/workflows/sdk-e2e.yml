name: SDK E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sdk-e2e.yml"
      - "packages/sdk/**"
      - "packages/tracker/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report tracker changes without uploading
        type: boolean
        default: false
      force:
        description: Re-upload every tracker file
        type: boolean
        default: false
  pull_request:
    branches: [main, staging]
    paths:
      - ".github/workflows/sdk-e2e.yml"
      - "packages/sdk/**"
      - "packages/tracker/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: sdk-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk-e2e:
    name: SDK Playwright
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build sdk and tracker
        run: bunx turbo run build --filter @databuddy/sdk --filter @databuddy/tracker
      - name: Install Playwright browser
        run: bun run --cwd packages/sdk playwright install --with-deps chromium
      - name: Run sdk E2E
        run: bun run --cwd packages/sdk playwright test --project=chromium
      - name: Run tracker E2E
        run: bun run --cwd packages/tracker playwright test --project=chromium
      - name: Upload tracker build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracker-dist
          path: packages/tracker/dist/*.js
          if-no-files-found: error
          retention-days: 90
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-e2e-artifacts
          path: |
            packages/sdk/test-results
            packages/tracker/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-tracker:
    name: Deploy Tracker
    needs: sdk-e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: tracker-cdn
      url: https://cdn.databuddy.cc/databuddy.js
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: tracker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracker-dist
          path: packages/tracker/dist
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/tracker/dist/*.js
      - name: Deploy to Bunny
        env:
          BUNNY_STORAGE_ZONE_NAME: ${{ vars.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_STORAGE_REGION }}
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.TRACKER_DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DB_POOL_MAX: "1"
          SERVICE_NAME: tracker-deploy
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          bun run --cwd packages/tracker deploy "${args[@]}"
