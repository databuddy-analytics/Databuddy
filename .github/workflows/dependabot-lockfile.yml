name: Dependabot Lockfile

# Dependabot edits package.json but never regenerates bun.lock, so every npm
# update PR dies on `bun install --frozen-lockfile` before any check runs.
# pull_request_target is required because Dependabot's GITHUB_TOKEN is
# read-only and cannot be elevated by a permissions block. The PR branch is
# only ever resolved with --ignore-scripts, so no package code executes here.

on:
  pull_request_target:
    branches: [staging]
    paths:
      - "**/package.json"

permissions:
  contents: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh bun.lock
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - run: bun install --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun.lock"
          git push
