name: Health Check

on:
  push:
    branches: [main]
    paths:
      - "*.Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "apps/basket/**"
      - "apps/insights/**"
      - "apps/links/**"
      - "infra/ingest/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/health-check.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "*.Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "apps/basket/**"
      - "apps/insights/**"
      - "apps/links/**"
      - "infra/ingest/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/health-check.yml"

permissions:
  contents: read

concurrency:
  group: health-check-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vector-config-check:
    name: Vector Delivery Canary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.5.1-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate Vector config
        run: |
          docker run --rm \
            -v "$PWD/infra/ingest/vector.yaml:/etc/vector/vector.yaml:ro" \
            -e REDPANDA_BROKER=localhost:9092 \
            -e VECTOR_KAFKA_USER=vector-test \
            -e VECTOR_KAFKA_PASSWORD=vector-test-password \
            -e CLICKHOUSE_URL=http://localhost:8123 \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD=vector-test-password \
            timberio/vector:0.50.0-alpine \
            validate --deny-warnings --no-environment /etc/vector/vector.yaml

      - name: Prove Redpanda to Vector to ClickHouse delivery
        run: |
          set -euo pipefail

          # ShellCheck cannot see that trap invokes this function.
          # shellcheck disable=SC2317
          cleanup() {
            docker rm -f vector-delivery-canary vector-canary-redpanda >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          curl -fsS \
            --data-binary 'CREATE DATABASE IF NOT EXISTS analytics' \
            http://localhost:8123/
          sed -E \
            "s@ENGINE = ReplicatedReplacingMergeTree\\('[^']*', '[^']*', ([^)]+)\\)@ENGINE = ReplacingMergeTree(\\1)@" \
            packages/db/src/clickhouse/schema/analytics/core/custom_events.sql \
            | curl -fsS --data-binary @- http://localhost:8123/
          curl -fsS \
            --data-binary 'SYSTEM STOP MERGES analytics.custom_events' \
            http://localhost:8123/

          docker run -d \
            --name vector-canary-redpanda \
            --network host \
            redpandadata/redpanda:v25.2.9 \
            redpanda start \
            --mode dev-container \
            --smp 1 \
            --default-log-level=warn \
            --kafka-addr 0.0.0.0:9092 \
            --advertise-kafka-addr localhost:9092

          for i in {1..30}; do
            if docker exec vector-canary-redpanda rpk cluster health >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs vector-canary-redpanda
              exit 1
            fi
            sleep 1
          done

          docker exec vector-canary-redpanda \
            rpk topic create analytics-custom-events

          docker run -d \
            --name vector-delivery-canary \
            --network host \
            -v "$PWD/infra/ingest/vector.yaml:/etc/vector/vector.yaml:ro" \
            -e REDPANDA_BROKER=localhost:9092 \
            -e VECTOR_KAFKA_USER=unused \
            -e VECTOR_KAFKA_PASSWORD=unused \
            -e VECTOR_KAFKA_SASL_ENABLED=false \
            -e VECTOR_KAFKA_TLS_ENABLED=false \
            -e CLICKHOUSE_URL=http://localhost:8123 \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD= \
            timberio/vector:0.50.0-alpine \
            --config /etc/vector/vector.yaml

          CANARY_ID="ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          CANARY_PAYLOAD=$(jq -cn \
            --arg delivery_id "$CANARY_ID" \
            '{
              owner_id: "ci-owner",
              website_id: "ci-website",
              timestamp: "2026-08-01T00:00:00.000Z",
              event_name: "vector_delivery_canary",
              namespace: "ci",
              path: "/ci/vector-canary",
              properties: "{}",
              anonymous_id: "ci-anonymous",
              session_id: "ci-session",
              source: "ci",
              profile_id: "",
              delivery_id: $delivery_id
            }')

          printf '%s\n' "$CANARY_PAYLOAD" \
            | docker exec -i vector-canary-redpanda \
                rpk topic produce analytics-custom-events

          for i in {1..30}; do
            FIRST_COUNT=$(curl -fsSG \
              --data-urlencode \
                'query=SELECT count() FROM analytics.custom_events WHERE delivery_id = {delivery_id:String}' \
              --data-urlencode "param_delivery_id=$CANARY_ID" \
              http://localhost:8123/)
            if [ "$FIRST_COUNT" = "1" ]; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "First canary delivery did not reach ClickHouse"
              docker logs vector-delivery-canary
              exit 1
            fi
            sleep 1
          done

          printf '%s\n' "$CANARY_PAYLOAD" \
            | docker exec -i vector-canary-redpanda \
                rpk topic produce analytics-custom-events

          for i in {1..45}; do
            PHYSICAL_COUNT=$(curl -fsSG \
              --data-urlencode \
                'query=SELECT count() FROM analytics.custom_events WHERE delivery_id = {delivery_id:String}' \
              --data-urlencode "param_delivery_id=$CANARY_ID" \
              http://localhost:8123/)
            LOGICAL_COUNT=$(curl -fsSG \
              --data-urlencode \
                'query=SELECT count() FROM analytics.custom_events FINAL WHERE delivery_id = {delivery_id:String}' \
              --data-urlencode "param_delivery_id=$CANARY_ID" \
              http://localhost:8123/)
            if [ "$PHYSICAL_COUNT" = "2" ] && [ "$LOGICAL_COUNT" = "1" ]; then
              echo "Vector replay produced two physical rows and one logical delivery"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' vector-delivery-canary | grep -q true; then
              docker logs vector-delivery-canary
              exit 1
            fi
            sleep 1
          done

          echo "Canary replay was not logically deduplicated within 45 seconds"
          docker logs vector-delivery-canary
          docker logs vector-canary-redpanda
          exit 1

  api-health-check:
    name: API Health Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: databuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d databuddy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Mount Docker build cache
        uses: useblacksmith/stickydisk@4c034ba57b706cf0e3b4b0ce098c2a3b1071580c # v1
        with:
          key: ${{ github.repository }}-docker-build-cache
          path: /tmp/docker-build-cache

      - name: Set up Docker Builder
        uses: useblacksmith/setup-docker-builder@722e97d12b1d06a961800dd6c05d79d951ad3c80 # v1

      - name: Build API Docker image
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: ./api.Dockerfile
          push: false
          load: true
          tags: api:test

      - name: Run API health check
        run: |
          set -euo pipefail
          trap 'docker rm -f api-health-check >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name api-health-check \
            --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/databuddy_test \
            -e REDIS_URL=redis://localhost:6379 \
            -e BETTER_AUTH_SECRET=test-auth-secret-for-ci \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e GITHUB_CLIENT_ID=test-github-client-id \
            -e GITHUB_CLIENT_SECRET=test-github-client-secret \
            -e GOOGLE_CLIENT_ID=test-google-client-id \
            -e GOOGLE_CLIENT_SECRET=test-google-client-secret \
            -e RESEND_API_KEY=test-resend-api-key \
            -e AUTUMN_SECRET_KEY=test-autumn-secret-key \
            -e CLICKHOUSE_URL=http://default:@localhost:8123/analytics \
            api:test

          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "API is responding!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start within 30 seconds"
              docker logs api-health-check
              exit 1
            fi
            sleep 1
          done

          STATUS_BODY=$(curl -sS http://localhost:3001/health/status)
          echo "API /health/status: $STATUS_BODY"
          if echo "$STATUS_BODY" | grep -q '"status":"ok"'; then
            echo "API dependency health is valid"
          else
            echo "API dependency health is not ok"
            docker logs api-health-check
            exit 1
          fi

          RESPONSE=$(curl -sf http://localhost:3001/health || echo '{}')
          echo "API /health: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"status"'; then
            echo "API health endpoint structure is valid"
          else
            echo "API health endpoint response missing expected fields"
            docker logs api-health-check
            exit 1
          fi

          echo "API health check passed!"

  basket-health-check:
    name: Basket Health Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
