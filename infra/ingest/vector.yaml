# Railway service filesystems are ephemeral. Redpanda is the durable backlog:
# each acknowledged ClickHouse sink below holds its Kafka offset until the
# warehouse confirms delivery, so an interrupted process replays from Kafka.

sources:
  redpanda:
    type: kafka
    bootstrap_servers: "${REDPANDA_BROKER}"
    group_id: vector-analytics
    topics:
      - analytics-events
      - analytics-error-spans
      - analytics-vitals-spans
      - analytics-custom-events
      - analytics-ai-traffic-spans
      - analytics-outgoing-links
      - analytics-blocked-traffic
      - analytics-uptime-checks
      - analytics-link-visits
    auto_offset_reset: earliest
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-256
      username: "${VECTOR_KAFKA_USER}"
      password: "${VECTOR_KAFKA_PASSWORD}"
    tls:
      enabled: true
    decoding:
      codec: json

transforms:
  route_analytics:
    type: route
    inputs:
      - redpanda
    route:
      events: '.topic == "analytics-events"'
      error_spans: '.topic == "analytics-error-spans"'
      vitals_spans: '.topic == "analytics-vitals-spans"'
      custom_events: '.topic == "analytics-custom-events"'
      ai_traffic_spans: '.topic == "analytics-ai-traffic-spans"'
      outgoing_links: '.topic == "analytics-outgoing-links"'
      blocked_traffic: '.topic == "analytics-blocked-traffic"'
      uptime_checks: '.topic == "analytics-uptime-checks"'
      link_visits: '.topic == "analytics-link-visits"'

sinks:
  clickhouse_events:
    type: clickhouse
    inputs:
      - route_analytics.events
    endpoint: "${CLICKHOUSE_URL}"
    database: analytics
    table: events
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 5000
      max_bytes: 5000000
      timeout_secs: 5
    acknowledgements:
      enabled: true
    buffer:
      type: memory
      max_events: 500
      when_full: block
    date_time_best_effort: true
    skip_unknown_fields: true
    encoding:
      timestamp_format: unix_ms

  clickhouse_error_spans:
    type: clickhouse
    inputs:
      - route_analytics.error_spans
    endpoint: "${CLICKHOUSE_URL}"
    database: analytics
    table: error_spans
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      max_events: 5000
      max_bytes: 5000000
      timeout_secs: 5
    acknowledgements:
