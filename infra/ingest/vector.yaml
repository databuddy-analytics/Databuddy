acknowledgements:
  enabled: true

log_schema:
  # Keep Kafka record time separate from the analytics event's immutable time.
  timestamp_key: kafka_timestamp

sources:
  redpanda:
    type: kafka
    bootstrap_servers: "${REDPANDA_BROKER}"
    group_id: vector-analytics
    topics:
      - analytics-events
      - analytics-error-spans
      - analytics-vitals-spans
      - analytics-engagement-spans
      - analytics-custom-events
      - analytics-ai-traffic-spans
      - analytics-outgoing-links
      - analytics-blocked-traffic
      - analytics-uptime-checks
      - analytics-link-visits
    auto_offset_reset: earliest
    sasl:
      enabled: ${VECTOR_KAFKA_SASL_ENABLED:-true}
      mechanism: SCRAM-SHA-256
      username: "${VECTOR_KAFKA_USER}"
      password: "${VECTOR_KAFKA_PASSWORD}"
    tls:
      enabled: ${VECTOR_KAFKA_TLS_ENABLED:-true}
    decoding:
      codec: json

transforms:
  route_analytics:
    type: route
    inputs:
      - redpanda
    route:
      events: '.topic == "analytics-events"'
      error_spans: '.topic == "analytics-error-spans"'
      vitals_spans: '.topic == "analytics-vitals-spans"'
      engagement_spans: '.topic == "analytics-engagement-spans"'
      custom_events: '.topic == "analytics-custom-events"'
      ai_traffic_spans: '.topic == "analytics-ai-traffic-spans"'
      outgoing_links: '.topic == "analytics-outgoing-links"'
      blocked_traffic: '.topic == "analytics-blocked-traffic"'
      uptime_checks: '.topic == "analytics-uptime-checks"'
      link_visits: '.topic == "analytics-link-visits"'

# Every sink URI: a batch spanning more than 100 daily partitions would return a
# 500 that is retried forever and stalls the topic, so it only logs a warning.
# Rows ClickHouse cannot parse are skipped instead of failing the whole batch
# with a 400 that Vector drops; a batch still fails once more than 100 rows and
# more than half of the rows read so far are bad, so a schema break stays loud.
sinks:
  clickhouse_events:
    type: http
    inputs:
      - route_analytics.events
    uri: "${CLICKHOUSE_URL}/?input_format_import_nested_json=1&input_format_skip_unknown_fields=1&date_time_input_format=best_effort&throw_on_max_partitions_per_insert_block=0&input_format_allow_errors_num=100&input_format_allow_errors_ratio=0.5&query=INSERT+INTO+analytics.events+FORMAT+JSONEachRow"
    method: post
    auth:
      strategy: basic
      user: "${CLICKHOUSE_USER}"
      password: "${CLICKHOUSE_PASSWORD}"
    compression: gzip
    encoding:
      codec: json
      timestamp_format: unix_ms
    framing:
      method: newline_delimited
    batch:
      max_events: 5000
      max_bytes: 5000000
      timeout_secs: 5
    request:
      headers:
        CF-Access-Client-Id: "${CLICKHOUSE_ACCESS_CLIENT_ID:-}"
        CF-Access-Client-Secret: "${CLICKHOUSE_ACCESS_CLIENT_SECRET:-}"
    retry_strategy:
      type: custom
      status_codes: [302, 401, 403, 408, 429, 500, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 520, 521, 522, 523, 524, 525, 526, 527, 530]
    healthcheck:
      enabled: false

